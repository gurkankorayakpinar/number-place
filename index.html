<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUMBER PLACE</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="game-container">
        <div class="header">
            <h1>NUMBER PLACE</h1>
            <div id="level-display">Seviye: 1</div>
        </div>

        <div id="game-board" class="grid"></div>

        <div class="controls">
            <div class="number-pad">
                <button onclick="inputNumber(1)">1</button>
                <button onclick="inputNumber(2)">2</button>
                <button onclick="inputNumber(3)">3</button>
                <button onclick="inputNumber(4)">4</button>
                <button onclick="inputNumber(5)">5</button>
                <button onclick="inputNumber(6)">6</button>
                <button onclick="inputNumber(7)">7</button>
                <button onclick="inputNumber(8)">8</button>
                <button onclick="inputNumber(9)">9</button>
            </div>
            <div class="action-buttons">
                <button id="delete-btn" onclick="deleteNumber()">SİL</button>
                <button id="new-game-btn" onclick="startNewGame()">YENİ OYUN</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
